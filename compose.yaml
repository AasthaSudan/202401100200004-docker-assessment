services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-festpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-festpass}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-festpass} -d ${POSTGRES_DB:-festpass}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: aasthasudan/fest-backend:1.0.0
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-festpass}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-festpass}
      REGNO: ${REGNO}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  frontend:
    image: nginx:1.30-alpine
    restart: always
    ports:
      - "${PORT:-8004}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-net

volumes:
  db_data:

networks:
  frontend-net:
  backend-net:
